# nginx/nginx.conf
# Single entry point (port 80) that routes /api to the backend and
# everything else to the frontend dev server — matches the "deployed
# behind Nginx" line in the synopsis's methodology section.

events {}

http {
    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend:8000/api/;
        }

        location / {
            proxy_pass http://frontend:5173/;
        }
    }
}